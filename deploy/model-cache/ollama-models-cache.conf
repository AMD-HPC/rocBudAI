# systemd drop-in for ollama.service — point the daemon at the local
# NVMe cache instead of the NFS-shared model store.
#
# Lives at: /etc/systemd/system/ollama.service.d/model-cache.conf
#
# What this overrides: the Environment= line in /etc/systemd/system/
# ollama.service that sets OLLAMA_MODELS=/shareddata/Ollama_Models.
# After this drop-in, ollama mmaps blobs from /var/local/cache/ollama
# (populated at boot by rocbudai-model-cache.service).
#
# Boot ordering is enforced here too — without the Requires= +
# After= pair, ollama could theoretically race ahead of the rsync
# and try to load from an empty cache directory.

[Unit]
Requires=rocbudai-model-cache.service
After=rocbudai-model-cache.service

[Service]
Environment="OLLAMA_MODELS=/var/local/cache/ollama"
